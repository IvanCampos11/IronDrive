services:
  irondrive:
    image: ghcr.io/ivancampos11/irondrive:${IRONDRIVE_IMAGE_TAG:-dev}
    container_name: irondrive
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 8000
      RUST_LOG: info
      IRONDRIVE_DATA_DIR: /var/lib/irondrive/data
      IRONDRIVE_DB_DIR: /var/lib/irondrive/db
      IRONDRIVE_SECRET_KEY: ${IRONDRIVE_SECRET_KEY:?Set IRONDRIVE_SECRET_KEY in your .env file}
    volumes:
      - ${IRONDRIVE_DATA_HOST_PATH:-irondrive_data}:/var/lib/irondrive/data
      - ${IRONDRIVE_DB_HOST_PATH:-irondrive_db}:/var/lib/irondrive/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  irondrive_data:
  irondrive_db:
