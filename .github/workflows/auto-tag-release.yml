name: Auto Tag Release

# Merging a labelled PR into dev cuts a pre-release (vX.Y.Z-rc.N).
# Merging dev into main promotes the pending version to a stable vX.Y.Z.
# A hotfix PR straight into main with a semver label bumps the stable version.
on:
  pull_request_target:
    types: [closed]
    branches: [dev, main]

permissions:
  contents: read

jobs:
  tag:
    name: Create release tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Read version label
        id: bump
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          bumps=$(jq -r '[.[] | capture("^(semver-)?(?<b>major|minor|patch)$").b] | unique | join(" ")' <<<"$LABELS")
          if [ "$(wc -w <<<"$bumps")" -gt 1 ]; then
            echo "::error::Conflicting version labels: $bumps"
            exit 1
          fi
          echo "bump=$bumps" >> "$GITHUB_OUTPUT"

      - name: Checkout merge commit
        # Trusted: this is the already-merged commit on dev/main, not the PR head.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Work out the next version
        id: version
        run: |
          python3 .github/scripts/next_version.py \
            --mode "${{ github.event.pull_request.base.ref }}" \
            --bump "${{ steps.bump.outputs.bump }}" | tee -a "$GITHUB_OUTPUT"

      - name: Check release token
        if: steps.version.outputs.should_tag == 'true' && steps.version.outputs.already_tagged != 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Tags pushed with the default GITHUB_TOKEN don't trigger other workflows,
          # so the release build needs a personal token.
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Missing RELEASE_TOKEN secret (fine-grained PAT with Contents: read and write)."
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.should_tag == 'true' && steps.version.outputs.already_tagged != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.version.outputs.tag }}"
          git tag -a "$tag" -m "Release $tag (#${{ github.event.pull_request.number }})"
          git push origin "$tag"

      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.should_tag }}" != true ]; then
            echo "No release: the PR has no semver label and there is no pending pre-release to promote." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.version.outputs.already_tagged }}" = true ]; then
            echo "Commit was already tagged ${{ steps.version.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tagged **${{ steps.version.outputs.tag }}**; the Release workflow is building it now." >> "$GITHUB_STEP_SUMMARY"
          fi
