name: Publish Container Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/irondrive

jobs:
  gate:
    name: Check publish gate
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Check if publish is allowed
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Always publish for tags, main branch, and manual runs
            if (context.ref.startsWith('refs/tags/') ||
                context.ref === 'refs/heads/main' ||
                context.eventName === 'workflow_dispatch') {
              core.setOutput('should_publish', 'true');
              core.info('Publishing: tag, main branch, or manual dispatch.');
              return;
            }

            // For dev branch pushes, only publish if the merged PR has a version label
            if (context.ref === 'refs/heads/dev') {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const merged = prs.find(pr => pr.merged_at);
              if (merged) {
                const versionLabels = [
                  'release',
                  'semver-major',
                  'semver-minor',
                  'semver-patch',
                  'major',
                  'minor',
                  'patch',
                ];
                const hasLabel = merged.labels.some(l => versionLabels.includes(l.name));
                core.setOutput('should_publish', hasLabel ? 'true' : 'false');
                core.info(hasLabel
                  ? `PR #${merged.number} has a version label — publishing.`
                  : `PR #${merged.number} has no version label — skipping publish.`);
                return;
              }
              core.info('No merged PR found for this commit on dev — skipping publish.');
              core.setOutput('should_publish', 'false');
              return;
            }

            core.setOutput('should_publish', 'false');

  publish:
    name: Build and publish image
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.title=IronDrive
            org.opencontainers.image.description=Self-hosted encrypted cloud file storage
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=TBD

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
