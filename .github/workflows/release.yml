name: Release

# Trigger on version tags only
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: irondrive
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/irondrive

jobs:
  branch_guard:
    name: Verify tag source branch
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.guard.outputs.source_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main or dev
        id: guard
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          commit="$(git rev-list -n 1 "$tag")"

          git fetch origin main dev --no-tags

          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "source_branch=main" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$commit" origin/dev; then
            echo "source_branch=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$tag' must point to a commit on 'main' or 'dev'."
            exit 1
          fi

  # First, run tests before building release artifacts
  check:
    name: Pre-release checks
    needs: branch_guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo clippy -- -D warnings

  publish_image:
    name: Publish Container Image
    needs:
      - branch_guard
      - check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.branch_guard.outputs.source_branch == 'main' }}
            type=raw,value=edge,enable=${{ needs.branch_guard.outputs.source_branch == 'dev' }}
          labels: |
            org.opencontainers.image.title=IronDrive
            org.opencontainers.image.description=Self-hosted encrypted cloud file storage
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=TBD

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # For cross-compiling aarch64 linux
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # Package the binary
      - name: Package (unix)
        id: package_unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          staging="${BINARY_NAME}-${tag}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$staging/"
          cp README.md ARCHITECTURE.md TODO.md "$staging/" 2>/dev/null || true
          tar czf "${staging}.tar.gz" "$staging"
          echo "asset=${staging}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package (windows)
        id: package_windows
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          staging="${BINARY_NAME}-${tag}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" "$staging/"
          cp README.md ARCHITECTURE.md TODO.md "$staging/" 2>/dev/null || true
          7z a "${staging}.zip" "$staging"
          echo "asset=${staging}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package_unix.outputs.asset || steps.package_windows.outputs.asset }}

  release:
    name: Create GitHub Release
    needs:
      - build
      - publish_image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine if prerelease
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Anything with alpha/beta/rc or 0.x.x is a prerelease
          if [[ "$tag" == *"-"* ]] || [[ "$tag" == v0.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
