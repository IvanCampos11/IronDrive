name: Release

# Builds and publishes a release for every version tag:
#   vX.Y.Z        (from main) -> stable release, images :X.Y.Z :X.Y :latest
#   vX.Y.Z-rc.N   (from dev)  -> pre-release,    images :X.Y.Z-rc.N :edge
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  meta:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          commit="$(git rev-list -n 1 "$tag")"
          git fetch -q origin main dev --no-tags
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            branch=main; prerelease=false
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            branch=dev; prerelease=true
          else
            echo "::error::Tag $tag is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1
          fi
          # Pre-releases may also come from main (e.g. testing a hotfix).
          if ! git merge-base --is-ancestor "$commit" "origin/$branch" \
             && ! { [ "$prerelease" = true ] && git merge-base --is-ancestor "$commit" origin/main; }; then
            echo "::error::$tag must point to a commit on $branch."; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/irondrive" >> "$GITHUB_OUTPUT"

  check:
    name: Tests
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  binaries:
    name: Build ${{ matrix.target }}
    needs: [meta, check]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu = older glibc, so the binary runs on more distros.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Stamp version
        run: python3 .github/scripts/set_version.py "${{ github.ref_name }}"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: pkg
        shell: bash
        run: |
          name="irondrive-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/irondrive" "$name/"
          cp -R templates static migrations "$name/"
          cp Rocket.toml .env.example LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

  image:
    name: Container image
    needs: [meta, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: python3 .github/scripts/set_version.py "${{ github.ref_name }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.meta.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=edge,enable=${{ needs.meta.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.title=IronDrive
            org.opencontainers.image.description=Self-hosted encrypted cloud file storage
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker.outputs.tags }}
          labels: ${{ steps.docker.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub release
    needs: [meta, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Write release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags --force
          python3 .github/scripts/release_notes.py --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IronDrive ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'false' }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
