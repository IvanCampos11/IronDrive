name: Release

# Trigger on version tags only
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/irondrive

jobs:
  branch_guard:
    name: Verify tag source branch
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.guard.outputs.source_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main or dev
        id: guard
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          commit="$(git rev-list -n 1 "$tag")"

          git fetch origin main dev --no-tags

          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "source_branch=main" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$commit" origin/dev; then
            echo "source_branch=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$tag' must point to a commit on 'main' or 'dev'."
            exit 1
          fi

  check:
    name: Pre-release checks
    needs: branch_guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo clippy -- -D warnings

  publish_image:
    name: Publish Container Image
    needs:
      - branch_guard
      - check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.branch_guard.outputs.source_branch == 'main' }}
            type=raw,value=edge,enable=${{ needs.branch_guard.outputs.source_branch == 'dev' }}
          labels: |
            org.opencontainers.image.title=IronDrive
            org.opencontainers.image.description=Self-hosted encrypted cloud file storage
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=TBD

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: publish_image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine if prerelease
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *"-"* ]] || [[ "$tag" == v0.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
